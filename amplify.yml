# AWS Amplify Hosting (SSR compute) for apps/web in this pnpm monorepo.
# Set AMPLIFY_MONOREPO_APP_ROOT=apps/web and the environment variables listed in
# docs/DEPLOY.md in the Amplify console.
version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@11.1.3 --activate
            - cd ../.. && pnpm install --frozen-lockfile --filter "@longhand/web..." && cd apps/web
        build:
          commands:
            # Amplify exposes console variables at build time only; Next reads
            # .env.production at runtime, so the server-rendered layout can inline them.
            - env | grep -E '^(LEDGER_URL|LEDGER_PUBLIC_URL|AUTH_MODE|WEB_ORIGIN|COGNITO_[A-Z_]+)=' > .env.production || true
            - pnpm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/.pnpm/**/*
          - .next/cache/**/*
